<!doctype html>
<html lang="es">
<head>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍺</text></svg>">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Batalla por Villaviciosa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,700;0,800;1,400&family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* LA BATALLA POR VILLAVICIOSA — styles.css
   Paleta: cal (paredes encaladas), pizarra (tejados y piedra), teja, sidra, prao, madera. */
:root {
  --cal: #efe7d4; --cal2: #e2d6ba; --pizarra: #2f3a45; --pizarra2: #3b4855; --teja: #b5452c; --sidra: #c8a93a; --prao: #4f8a35; --madera: #6d4223; --ria: #2f6f9e;
  --bg: #e9e0cb; --panel: #f4eedf; --panel2: #e6dcc3; --ink: #2a2620; --muted: #6e6455; --line: #b9a888; --btn: #6d4223; --btnInk: #fbf3df; --accent: #b5452c; --focus: #2f6f9e;
  color-scheme: light;
  box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  --font-d: 'Pixelify Sans', 'Courier New', ui-monospace, monospace;
  --font-b: 'Alegreya Sans', 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1d242c; --panel: #26303a; --panel2: #303c48; --ink: #ece4d0; --muted: #a59c8a; --line: #4c5a68; --btn: #c8a93a; --btnInk: #1d242c; --accent: #e0694d; --focus: #8cc6ef; color-scheme: dark;
  }
}
:root[data-theme="dark"] { --bg: #1d242c; --panel: #26303a; --panel2: #303c48; --ink: #ece4d0; --muted: #a59c8a; --line: #4c5a68; --btn: #c8a93a; --btnInk: #1d242c; --accent: #e0694d; --focus: #8cc6ef; color-scheme: dark; }
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font-b); font-size: 16px; line-height: 1.4; overflow: hidden; }
#app { height: 100%; position: relative; }
.pix { image-rendering: pixelated; image-rendering: crisp-edges; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: 0.45; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
h1, h2, h3, h4 { font-family: var(--font-d); font-weight: 600; margin: 0 0 0.4em; letter-spacing: 0.01em; }
.muted { color: var(--muted); } .small { font-size: 0.85em; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; } .row.end { justify-content: flex-end; margin-top: 14px; }
.hidden { display: none !important; }

.btn { background: var(--btn); color: var(--btnInk); border: 2px solid rgba(0,0,0,0.35); border-radius: 4px; padding: 8px 16px; font-family: var(--font-d); font-size: 15px; box-shadow: 0 3px 0 rgba(0,0,0,0.35); transition: transform .06s; }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.35); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); box-shadow: none; }
.btn.danger { background: var(--teja); color: #fff6e6; }
.btn.end { background: var(--prao); color: #f5f1e2; font-size: 16px; padding: 10px 22px; }

/* ---------- Pantallas ---------- */
.screen { position: absolute; inset: 0; display: none; }
.screen.active { display: block; }

/* Menú principal */
#scr-menu { background: #2b2f63; }
#menu-bg { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
.menu-box { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 6vh 7vw; max-width: 760px; }
.title { font-family: var(--font-d); font-weight: 700; color: #fff4d6; font-size: clamp(42px, 8vw, 104px); line-height: 0.92; margin: 0; text-shadow: 4px 4px 0 #6d1f12, 8px 8px 0 rgba(20,10,30,0.45); }
.title span { display: block; font-size: 0.36em; color: #f2c12e; text-shadow: 3px 3px 0 #6d1f12; margin-bottom: 0.15em; letter-spacing: 0.04em; }
.subtitle { color: #fff1d0; font-size: clamp(16px, 2vw, 21px); font-style: italic; margin: 18px 0 30px; text-shadow: 2px 2px 0 rgba(0,0,0,0.5); max-width: 34ch; }
.menu-nav { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.menu-nav button { font-family: var(--font-d); font-size: 19px; letter-spacing: 0.06em; background: #6d4223; color: #fbefd2; border: 3px solid #2b1a0e; padding: 10px 22px 10px 18px; min-width: 380px; text-align: left; box-shadow: 5px 5px 0 rgba(20,10,30,0.55); position: relative; }
.menu-nav button::before { content: ''; position: absolute; left: -3px; top: -3px; bottom: -3px; width: 8px; background: #c8a93a; }
.menu-nav button:hover:not(:disabled) { background: #85532d; transform: translateX(6px); }
.menu-nav button:first-child { background: #b5452c; }

/* Pantallas de contenido */
.page { height: 100%; overflow: auto; padding: 24px clamp(14px, 4vw, 48px) 40px; }
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.page-head h1 { font-size: clamp(26px, 4vw, 40px); margin: 0; }
.setup-sec { background: var(--panel); border: 2px solid var(--line); border-radius: 6px; padding: 16px; margin-bottom: 16px; }
.setup-sec h2 { font-size: 20px; }
.fac-row, .map-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.fac-card { text-align: left; background: var(--panel2); border: 3px solid transparent; border-left: 10px solid var(--fc); border-radius: 6px; padding: 12px; }
.fac-card.on { border-color: var(--fc); border-left-color: var(--fc); background: color-mix(in srgb, var(--fc) 18%, var(--panel)); }
.fac-card p { margin: 6px 0; font-size: 14px; } .fac-card .bonus { color: var(--muted); }
.fac-name { font-family: var(--font-d); font-size: 22px; color: var(--fc); filter: brightness(1.05); }
.fac-faces { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px; }
.fac-faces canvas { width: 34px; height: 34px; border-radius: 2px; }
.leader-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; margin: 10px 0; }
.leader { background: var(--panel2); border: 3px solid transparent; border-radius: 6px; padding: 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 13px; }
.leader canvas { width: 72px; height: 72px; } .leader.on { border-color: var(--accent); }
.leader-info p { margin: 4px 0; }
.map-card { text-align: left; background: var(--panel2); border: 3px solid transparent; border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.map-card canvas { width: 100%; max-width: 330px; height: auto; border-radius: 3px; } .map-card.on { border-color: var(--accent); } .map-card p { margin: 0; font-size: 14px; }
.opts { display: grid; grid-template-columns: max-content 1fr; gap: 10px 16px; align-items: center; }
.opts h2 { grid-column: 1 / -1; }
.seg { display: flex; flex-wrap: wrap; gap: 0; }
.seg button { background: var(--panel2); border: 2px solid var(--line); padding: 6px 12px; margin-right: -2px; font-size: 14px; }
.seg button.on { background: var(--btn); color: var(--btnInk); border-color: var(--btn); }
select { font: inherit; padding: 6px 8px; background: var(--panel2); color: var(--ink); border: 2px solid var(--line); border-radius: 4px; }
.start-bar { position: sticky; bottom: 0; display: flex; justify-content: flex-end; padding: 12px 0; }

/* Enciclopedia */
#scr-ency .ency-wrap { display: grid; grid-template-columns: 250px 1fr; gap: 16px; min-height: 0; }
#ency-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
#ency-tabs button { background: var(--panel2); border: 2px solid var(--line); border-radius: 4px; padding: 6px 12px; font-family: var(--font-d); }
#ency-tabs button.on { background: var(--btn); color: var(--btnInk); border-color: var(--btn); }
#ency-list { display: flex; flex-direction: column; gap: 4px; }
.ency-item { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 2px solid transparent; border-radius: 4px; padding: 4px; text-align: left; }
.ency-item canvas { width: 44px; height: 44px; } .ency-item.on { border-color: var(--accent); }
#ency-detail { background: var(--panel); border: 2px solid var(--line); border-radius: 6px; padding: 16px; }
.ency-top { display: grid; grid-template-columns: minmax(260px, 360px) 1fr; gap: 18px; }
.ency-stage { width: 100%; height: auto; border: 3px solid var(--fc); border-radius: 4px; }
.ency-stage-wrap { display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
.lvlnav { display: flex; align-items: center; justify-content: space-between; font-family: var(--font-d); }
.ency-info h2 { font-size: 28px; }
.evo-strip { margin-top: 18px; } .strip { display: flex; align-items: center; gap: 6px; overflow-x: auto; padding-bottom: 6px; }
.evo-step { display: flex; flex-direction: column; align-items: center; gap: 2px; background: var(--panel2); border: 2px solid transparent; border-radius: 6px; padding: 6px; min-width: 118px; font-size: 13px; }
.evo-step canvas { width: 96px; height: 114px; object-fit: contain; } .evo-step.on { border-color: var(--accent); }
.evo-arrow { font-family: var(--font-d); font-size: 26px; color: var(--muted); }

/* Ayuda */
.help { max-width: 72ch; } .help h3 { margin-top: 1.1em; } .help p, .help li { line-height: 1.55; }
.terr { border-collapse: collapse; } .terr td, .terr th { border-bottom: 1px solid var(--line); padding: 4px 14px 4px 0; text-align: left; }

/* ---------- Batalla ---------- */
#scr-battle.active { display: grid; grid-template-columns: 1fr 340px; grid-template-rows: auto 1fr 172px; height: 100%; }
#topbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 7px 12px; white-space: nowrap; overflow: hidden; background: #1f2830; color: #ece4d0; border-bottom: 3px solid #12181e; flex-wrap: wrap; font-size: 15px; }
#topbar .muted { color: #a8b0b8; }
.tb-round strong { font-family: var(--font-d); font-size: 18px; }
.tb-tod { display: flex; align-items: center; gap: 6px; font-family: var(--font-d); } .tod-ic { width: 22px; height: 22px; }
.tb-fac { font-family: var(--font-d); display: flex; align-items: center; gap: 8px; font-size: 17px; padding: 2px 12px; border-left: 6px solid var(--fc); background: rgba(255,255,255,0.06); }
.dot { width: 12px; height: 12px; background: var(--fc); display: inline-block; }
.tb-gold { display: flex; align-items: center; gap: 6px; font-family: var(--font-d); font-size: 17px; }
.coin { width: 14px; height: 14px; border-radius: 50%; background: #f2c12e; box-shadow: inset -3px -3px 0 #b8860b; display: inline-block; }
.pp { display: inline-block; min-width: 26px; text-align: center; padding: 1px 6px; margin-right: 3px; background: var(--fc); color: #fff; font-family: var(--font-d); border-radius: 3px; }
.tb-event { color: #f2d77a; font-size: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; }
.tb-btns { margin-left: auto; display: flex; gap: 6px; }
.tb-btns .icon { background: #2c3843; border: 2px solid #12181e; color: #ece4d0; padding: 4px 10px; border-radius: 3px; font-family: var(--font-d); font-size: 14px; }
#mapwrap { position: relative; overflow: hidden; background: #2b2620; min-height: 0; }
#map { display: block; width: 100%; height: 100%; touch-action: none; cursor: pointer; }
#goal { position: absolute; left: 12px; top: 12px; max-width: min(520px, 60%); text-align: left; background: rgba(20,16,24,0.82); color: #f4ecd8; border: 0; border-left: 5px solid #c8a93a; padding: 6px 12px; font-size: 14px; border-radius: 0 4px 4px 0; }
#goal .gl { font-family: var(--font-d); color: #f2c12e; margin-right: 8px; text-transform: uppercase; font-size: 12px; letter-spacing: .08em; }
#legend { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 6px; flex-wrap: wrap; pointer-events: none; }
#legend .lg { font-size: 12px; padding: 3px 8px 3px 22px; background: rgba(20,16,24,0.78); color: #f4ecd8; border-radius: 3px; position: relative; }
#legend .lg::before { content: ''; position: absolute; left: 7px; top: 50%; width: 10px; height: 10px; transform: translateY(-50%); }
#legend .mv::before { background: rgba(255,250,225,0.7); } #legend .at::before { border: 2px solid #ff4b3a; width: 8px; height: 8px; } #legend .ab::before { background: #ffcd3c; } #legend .th::before { background: rgba(220,50,40,0.6); } #legend .fl::before { background: linear-gradient(#d9a62e, #d9a62e) left/2px 100% no-repeat, #e8e2d2; }
#tip { position: absolute; pointer-events: none; background: rgba(28,20,36,0.94); color: #f4ecd8; padding: 8px 10px; border-radius: 4px; max-width: 260px; font-size: 13px; opacity: 0; transition: opacity .12s; border: 1px solid #5a4a6a; z-index: 3; }
#tip.on { opacity: 1; } #tip strong { font-family: var(--font-d); } #tip .muted { color: #bdb2c9; } .tp-prop { color: #f2c12e; font-weight: 700; margin-top: 4px; }
#banner { position: absolute; left: 50%; top: 16%; transform: translate(-50%, -10px); pointer-events: none; font-family: var(--font-d); font-size: 26px; color: #fff8e6; padding: 10px 30px; background: color-mix(in srgb, var(--bc) 82%, black); border-top: 4px solid #fff3; border-bottom: 4px solid #0004; opacity: 0; transition: opacity .25s, transform .25s; white-space: nowrap; text-shadow: 2px 2px 0 #0007; }
#banner.on { opacity: 1; transform: translate(-50%, 0); } #banner.big { font-size: 34px; top: 24%; }
#ticker { position: absolute; right: 56px; bottom: 12px; max-width: min(420px, 50%); background: rgba(20,16,24,0.86); color: #f4ecd8; padding: 7px 12px; border-left: 5px solid #ea80fc; font-size: 14px; font-style: italic; opacity: 0; transition: opacity .3s; pointer-events: none; }
#ticker.on { opacity: 1; } #ticker.lvl, #ticker.ult { border-color: #f2c12e; font-style: normal; font-weight: 700; } #ticker.event { border-color: #5fb0e8; font-style: normal; } #ticker.death { border-color: #9e9e9e; font-style: normal; } #ticker.cap { border-color: #6fbf5a; font-style: normal; }
.zoomctl { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 4px; z-index: 6; }
.zoomctl button { width: 36px; height: 36px; background: #1f2830; color: #ece4d0; border: 2px solid #12181e; font-family: var(--font-d); font-size: 20px; border-radius: 3px; }
#side { grid-row: 2 / 4; grid-column: 2; background: var(--panel); border-left: 3px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
#tabs { display: flex; border-bottom: 2px solid var(--line); }
#tabs button { flex: 1; background: var(--panel2); border: 0; border-right: 1px solid var(--line); padding: 9px 4px; font-family: var(--font-d); font-size: 14px; }
#tabs button.on { background: var(--panel); box-shadow: inset 0 -3px 0 var(--accent); }
#tabbody { flex: 1; overflow-y: auto; padding: 12px 14px; font-size: 14px; min-height: 0; }
#tabbody h3 { font-size: 19px; margin: 0; } #tabbody h4 { font-size: 14px; margin: 12px 0 4px; color: var(--muted); }
.up-head { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
.up-head canvas { width: 88px; height: 88px; flex: none; border-radius: 3px; }
.tag { display: inline-block; margin-left: 6px; background: var(--sidra); color: #2a2620; font-size: 11px; padding: 0 6px; border-radius: 2px; font-family: var(--font-d); }
.bar { display: grid; grid-template-columns: 92px 1fr 56px; align-items: center; gap: 6px; margin: 3px 0; }
.bl, .bv { font-family: var(--font-d); font-size: 13px; } .bv { text-align: right; }
.bt { height: 10px; background: #0003; border: 1px solid #0005; } .bt i { display: block; height: 100%; }
.stats { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 8px 0; font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; }
.chip { font-size: 12px; padding: 1px 6px; border-left: 5px solid var(--sc); background: var(--panel2); border-radius: 2px; }
.armed { font-size: 13px; color: var(--accent); font-weight: 700; }
.weap, .abl { list-style: none; padding: 0; margin: 0; }
.weap li { display: grid; grid-template-columns: 1fr auto; gap: 0 8px; padding: 3px 0; border-bottom: 1px dashed var(--line); }
.weap li .muted { grid-column: 1 / -1; font-size: 12px; }
.abl li { padding: 4px 0; border-bottom: 1px dashed var(--line); display: flex; flex-direction: column; } .abl li .muted { font-size: 12.5px; }
.res { display: flex; flex-wrap: wrap; gap: 4px; } .res span { font-size: 12px; background: var(--panel2); padding: 1px 6px; border-radius: 2px; }
.res .pos { color: #3d8b3a; font-weight: 700; } .res .neg { color: var(--accent); font-weight: 700; }
.desc { font-style: italic; color: var(--muted); margin-top: 12px; }
.ab-lvl { margin: 10px 0 14px; } .ab-lvl.locked { opacity: 0.62; }
.ab-lh { font-family: var(--font-d); font-size: 13px; color: var(--muted); border-bottom: 2px solid var(--line); padding-bottom: 3px; margin-bottom: 6px; display: flex; justify-content: space-between; }
.lock { color: var(--accent); }
.ab-item { background: var(--panel2); border-left: 4px solid var(--line); padding: 6px 8px; margin-bottom: 6px; border-radius: 2px; }
.ab-item.ult { border-left-color: var(--sidra); } .ab-item p { margin: 3px 0; font-size: 13px; }
.ab-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.ab-st { font-size: 12px; color: var(--muted); font-style: italic; }
.btn.small { padding: 3px 10px; font-size: 13px; }
.evo-card { display: grid; grid-template-columns: 64px 1fr; gap: 10px; align-items: center; padding: 8px; margin-bottom: 8px; background: var(--panel2); border: 2px solid transparent; border-radius: 4px; }
.evo-card canvas { width: 64px; height: 76px; object-fit: contain; } .evo-card.cur { border-color: var(--sidra); } .evo-card.next { opacity: 0.8; } .evo-card.past { opacity: 0.7; }
.evo-h { display: flex; justify-content: space-between; gap: 6px; } .evo-st { font-family: var(--font-d); font-size: 12px; color: var(--muted); }
.evo-card .small { margin-top: 2px; }
.loglist p { margin: 0 0 5px; font-size: 13px; } .loglist .quip { font-style: italic; color: var(--accent); } .loglist .lvl, .loglist .ult { color: #8a6d00; font-weight: 700; } .loglist .event { color: var(--ria); font-weight: 700; } .loglist .sys, .loglist .death { color: var(--muted); } .loglist .cap { color: var(--prao); }
.empty p { font-size: 14px; }
#mini { width: 100%; height: auto; max-height: 26vh; object-fit: contain; border-top: 3px solid var(--line); background: #1a2028; cursor: crosshair; image-rendering: pixelated; }
#bottombar { grid-column: 1; grid-row: 3; display: grid; grid-template-columns: minmax(200px, 1.5fr) minmax(260px, 1.4fr) auto; gap: 12px; padding: 10px 12px; background: var(--panel2); border-top: 3px solid var(--line); min-height: 0; }
#roster { display: flex; gap: 6px; overflow-x: auto; align-items: stretch; padding-bottom: 4px; min-width: 0; }
.ru { flex: none; width: 82px; display: flex; flex-direction: column; align-items: center; gap: 2px; background: var(--panel); border: 2px solid var(--line); border-radius: 4px; padding: 4px 3px; position: relative; font-size: 12px; }
.ru canvas { width: 44px; height: 44px; } .ru.on { border-color: var(--sidra); box-shadow: 0 0 0 2px var(--sidra); }
.ru .rn { font-family: var(--font-d); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 76px; }
.ru .rhp { width: 60px; height: 4px; background: #0004; } .ru .rhp i { display: block; height: 100%; background: #5ccf5c; }
.ru .rs { font-size: 10.5px; line-height: 1.1; text-align: center; color: var(--muted); }
.ru.ready { border-color: #4fa64a; } .ru.ready .rs { color: #3d8b3a; font-weight: 700; }
.ru.part { border-color: #d6a32e; } .ru.done { opacity: 0.55; } .ru.new { border-style: dashed; }
.ru .crown { position: absolute; top: 2px; left: 4px; width: 12px; height: 8px; background: linear-gradient(135deg, transparent 33%, #f2c12e 33%, #f2c12e 66%, transparent 66%), #f2c12e; clip-path: polygon(0 100%, 0 20%, 25% 60%, 50% 0, 75% 60%, 100% 20%, 100% 100%); }
#context { display: flex; flex-direction: column; gap: 4px; overflow-y: auto; min-width: 0; min-height: 0; }
.ctx-t { font-family: var(--font-d); font-size: 16px; } .ctx-d { margin: 0; font-size: 13.5px; line-height: 1.35; color: var(--ink); }
.abilbar { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.abil { display: flex; flex-direction: column; align-items: flex-start; text-align: left; background: var(--panel); border: 2px solid var(--line); border-radius: 4px; padding: 4px 10px; max-width: 220px; font-size: 12px; }
.abil .an { font-family: var(--font-d); font-size: 13px; } .abil .as { color: var(--muted); }
.abil.ult { border-color: var(--sidra); background: color-mix(in srgb, var(--sidra) 18%, var(--panel)); }
.abil.on { outline: 3px solid var(--sidra); }
#acts { display: flex; flex-direction: column; gap: 6px; justify-content: center; min-width: 170px; }
#acts .btn { padding: 6px 14px; font-size: 15px; }
#acts .btn.end { display: flex; flex-direction: column; align-items: center; padding: 10px 18px; }
#acts .btn.end small { font-family: var(--font-b); font-size: 12px; opacity: .85; }
@keyframes pulse { 0%, 100% { box-shadow: 0 3px 0 rgba(0,0,0,.35), 0 0 0 0 rgba(242,193,46,.0); } 50% { box-shadow: 0 3px 0 rgba(0,0,0,.35), 0 0 0 6px rgba(242,193,46,.55); } }
#acts .btn.end.pulse { animation: pulse 1.4s infinite; }
.ai-busy { display: flex; align-items: center; gap: 8px; font-family: var(--font-d); }
.spin { width: 14px; height: 14px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: sp 0.9s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }

/* ---------- Modales ---------- */
.modal { position: fixed; inset: 0; background: rgba(15,10,20,0.62); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
.modal-card { background: var(--panel); color: var(--ink); border: 3px solid var(--line); border-top: 8px solid var(--madera); border-radius: 6px; padding: 18px 20px; max-width: 520px; width: 100%; max-height: 92vh; overflow: auto; box-shadow: 8px 8px 0 rgba(0,0,0,0.35); }
.modal-card.wide { max-width: 860px; }
.confirm h3 { font-size: 22px; }
.hotseat { border-left: 8px solid var(--fc); padding-left: 12px; }
.pv-head { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; }
.pv-side { display: flex; gap: 10px; align-items: flex-start; border-left: 6px solid var(--fc); padding-left: 8px; font-size: 14px; }
.pv-side canvas { width: 72px; height: 72px; flex: none; }
.vs { font-family: var(--font-d); color: var(--muted); }
.kill { font-family: var(--font-d); } .kill.hi { color: var(--accent); }
.pv-weapons { display: flex; flex-direction: column; gap: 6px; margin: 14px 0 8px; }
.pv-w { display: grid; grid-template-columns: 1.4fr 0.5fr 1.3fr 0.5fr; gap: 4px 10px; text-align: left; background: var(--panel2); border: 2px solid var(--line); border-radius: 4px; padding: 8px 10px; align-items: center; }
.pv-w.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--panel)); }
.pv-w .wn { font-weight: 800; } .pv-w .cth { font-family: var(--font-d); font-size: 17px; text-align: right; }
.pv-w .counter { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
.pv-notes p { margin: 2px 0; font-size: 13px; }
.recruit .rec-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; margin-top: 10px; }
.rec { display: grid; grid-template-columns: 64px 1fr auto; gap: 10px; text-align: left; background: var(--panel2); border: 2px solid var(--line); border-radius: 5px; padding: 8px; align-items: center; }
.rec canvas { width: 64px; height: 64px; } .rec-info { display: flex; flex-direction: column; font-size: 13px; } .rec-info strong { font-size: 15px; }
.rec .cost { font-family: var(--font-d); font-size: 20px; color: #8a6d00; } .rec:hover:not(:disabled) { border-color: var(--accent); }
.levelcard h3 { font-size: 28px; text-align: center; color: var(--accent); }
.evo { display: flex; align-items: center; justify-content: center; gap: 18px; }
.evo figure { margin: 0; text-align: center; } .evo canvas { width: 144px; height: 171px; object-fit: contain; background: var(--panel2); border-radius: 6px; }
.evo figure.new canvas { box-shadow: 0 0 0 4px var(--sidra), 0 0 30px rgba(242,193,46,0.6); }
.evo figcaption { font-family: var(--font-d); margin-top: 6px; } .evo .evo-arrow { font-size: 44px; }
.diffs { list-style: none; padding: 0; margin: 14px auto; max-width: 520px; }
.diffs li { display: grid; grid-template-columns: 1.4fr 1fr 20px 1fr; gap: 8px; padding: 3px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
.diffs .arrow { color: var(--muted); } .diffs strong { color: #3d8b3a; }
.newab p { margin: 4px 0; font-size: 14px; }
.endcard h2 { font-size: 42px; color: var(--fc); }
.scores { border-collapse: collapse; width: 100%; margin: 10px 0; } .scores th, .scores td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); }
.settings { display: flex; flex-direction: column; gap: 8px; } .settings .chk { display: flex; gap: 8px; align-items: center; }
#toast { position: fixed; left: 50%; bottom: 150px; transform: translateX(-50%) translateY(12px); background: #2a1f33; color: #fbefd2; padding: 9px 16px; border-radius: 4px; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 60; max-width: 90vw; text-align: center; border-left: 5px solid var(--sidra); }
#toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- Pantallas estrechas ---------- */
@media (max-width: 900px) {
  #scr-battle.active { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; }
  #side { position: absolute; right: 0; top: 0; bottom: 0; width: min(320px, 86vw); z-index: 5; transform: translateX(100%); transition: transform .2s; }
  #side.open { transform: none; }
  #bottombar { grid-template-columns: 1fr; max-height: 46vh; overflow-y: auto; }
  #legend { display: none; }
  #acts { flex-direction: row; flex-wrap: wrap; }
  .side-toggle { display: block !important; }
  #scr-ency .ency-wrap { grid-template-columns: 1fr; } #ency-list { flex-direction: row; overflow-x: auto; }
  .ency-top { grid-template-columns: 1fr; } .opts { grid-template-columns: 1fr; }
  .menu-nav button { min-width: 0; width: 100%; }
  .pv-head { grid-template-columns: 1fr; }
}
.side-toggle { display: none; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

<body>
<div id="app">
  <section id="scr-menu" class="screen active">
    <canvas id="menu-bg" aria-hidden="true"></canvas>
    <div class="menu-box">
      <h1 class="title"><span>La Batalla por</span>Villaviciosa</h1>
      <p class="subtitle">Tres facciones. Una Villa. Demasiado poco sentido común.</p>
      <nav class="menu-nav" aria-label="Menú principal">
        <button data-act="new">NUEVA PARTIDA</button>
        <button data-act="continue" id="btn-continue">CONTINUAR PARTIDA</button>
        <button data-act="ency">ENCICLOPEDIA DE PERSONAJES</button>
        <button data-act="help">CÓMO JUGAR</button>
        <button data-act="settings">AJUSTES</button>
      </nav>
    </div>
  </section>

  <section id="scr-setup" class="screen">
    <div class="page">
      <div class="page-head"><h1>Nueva partida</h1><button class="btn ghost" data-act="menu">Volver</button></div>
      <div id="setup-body"></div>
      <div class="start-bar"><button class="btn end" data-act="start">Empezar batalla</button></div>
    </div>
  </section>

  <section id="scr-ency" class="screen">
    <div class="page">
      <div class="page-head"><h1>Enciclopedia de personajes</h1><button class="btn ghost" data-act="menu">Volver</button></div>
      <div id="ency-tabs" role="group" aria-label="Facciones"></div>
      <div class="ency-wrap"><div id="ency-list"></div><div id="ency-detail"></div></div>
    </div>
  </section>

  <section id="scr-help" class="screen">
    <div class="page">
      <div class="page-head"><h1>Cómo jugar</h1><button class="btn ghost" data-act="menu">Volver</button></div>
      <div id="help-body"></div>
    </div>
  </section>

  <section id="scr-battle" class="screen">
    <header id="topbar"></header>
    <div id="mapwrap">
      <canvas id="map" aria-label="Tablero hexagonal"></canvas>
      <button id="goal" title="Centrar la cámara en el comandante rival"></button>
      <div id="legend" aria-hidden="true"><span class="lg mv">Movimiento</span><span class="lg at">Atacable</span><span class="lg ab">Habilidad</span><span class="lg th">Alcance rival</span><span class="lg fl">Bandera: puesto que cura y da oro</span></div>
      <div id="tip" role="status"></div>
      <div id="banner" aria-live="polite"></div>
      <div id="ticker" aria-live="polite"></div>
      <div class="zoomctl">
        <button id="zoom-in" aria-label="Acercar">+</button>
        <button id="zoom-out" aria-label="Alejar">−</button>
        <button class="side-toggle" aria-label="Panel de unidad" onclick="document.getElementById('side').classList.toggle('open')">i</button>
      </div>
    </div>
    <aside id="side"><div id="tabs" role="tablist"></div><div id="tabbody"></div><canvas id="mini" width="300" height="270" aria-label="Minimapa"></canvas></aside>
    <footer id="bottombar"><div id="roster" aria-label="Tu ejército"></div><div id="context"></div><div id="acts"></div></footer>
  </section>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div class="modal-card" id="modal-card"></div></div>
  <div id="toast" role="status"></div>
</div>
<script>
/* LA BATALLA POR VILLAVICIOSA — data.js

  /* ---------------- HABILIDADES ----------------

  /* ---------- Combate ---------- */
  E.todMul = function (s, u) {
    const law = VV.TOD[E.tod(s)].law, al = D(u).align;
    if (al === 'l') return 1 + 0.25 * law;
    if (al === 'c') return 1 - 0.25 * law;
    return 1;
  };
  E.attackerMul = function (s, u, w) {
    let m = 1;
    for (const x of u.st) { const S = VV.STATUS[x.id]; if (S.dmg) m *= S.dmg; }
    const p = E.passive(u, 'nearSummonMelee');
    if (p && w.r === 'm') {
      const near = E.neighborsIdx(s, E.uIdx(s, u)).some(i => { const a = E.unitAtIdx(s, i); return a && a.summon && a.summon.by === u.id; });
      if (near) m *= 1 + p.nearSummonMelee;
    }
    return m;
  };
  E.damage = function (s, a, d, base, type, w, extraMul) {
    const res = E.resist(d)[type] || 0;
    let v = base * E.todMul(s, a) * (1 - res / 100) * E.attackerMul(s, a, w || { r: 'x' }) * (extraMul || 1);
    if (E.hasStatus(d, 'protegido')) v *= 0.8;
    return Math.max(1, Math.round(v));
  };
  E.cth = function (s, a, d, acc) {
    let v = 100 - E.defense(s, d) + (acc || 0);
    if (E.hasStatus(a, 'avergonzado')) v -= 10;
    return Math.max(20, Math.min(90, v));
  };
  E.armFor = (u, w) => (u.armed && (u.armed.range === 'any' || u.armed.range === w.r) ? u.armed : null);

  E.counterIndex = function (s, a, d, w) {
    const dw = E.weapons(d); let bi = -1, bv = -1;
    dw.forEach((x, k) => {
      if (x.r !== w.r) return;
      const v = E.damage(s, d, a, x.d, x.t, x) * x.s * E.cth(s, d, a, 0);
      if (v > bv) { bv = v; bi = k; }
    });
    return bi;
  };

  E.combatParams = function (s, a, d, wi) {
    const aw = E.weapons(a)[wi]; if (!aw) return null;
    const arm = E.armFor(a, aw);
    const di = E.counterIndex(s, a, d, aw);
    const dw = di >= 0 ? E.weapons(d)[di] : null;
    return {
      aw, dw, di,
      aDmg: E.damage(s, a, d, aw.d, aw.t, aw, arm && arm.dmgMul), aStr: aw.s, aCth: E.cth(s, a, d, arm && arm.acc),
      dDmg: dw ? E.damage(s, d, a, dw.d, dw.t, dw) : 0, dStr: dw ? dw.s : 0, dCth: dw ? E.cth(s, d, a, 0) : 0, arm
    };
  };

  // Distribución exacta de PV tras el combate (programación dinámica)
  E.predict = function (s, a, d, wi) {
    const P = E.combatParams(s, a, d, wi); if (!P) return null;
    let dist = new Map([[a.hp * 10000 + d.hp, 1]]);
    const n = Math.max(P.aStr, P.dStr);
    const step = (attacker) => {
      const nd = new Map();
      for (const [k, p] of dist) {
        const ah = Math.floor(k / 10000), dh = k % 10000;
        if (ah <= 0 || dh <= 0) { nd.set(k, (nd.get(k) || 0) + p); continue; }
        const hit = attacker ? P.aCth / 100 : P.dCth / 100;
        const k2 = attacker ? ah * 10000 + Math.max(0, dh - P.aDmg) : Math.max(0, ah - P.dDmg) * 10000 + dh;
        nd.set(k2, (nd.get(k2) || 0) + p * hit);
        nd.set(k, (nd.get(k) || 0) + p * (1 - hit));
      }
      dist = nd;
    };
    for (let k = 0; k < n; k++) { if (k < P.aStr) step(true); if (k < P.dStr) step(false); }
    let aDead = 0, dDead = 0, aExp = 0, dExp = 0;
    for (const [k, p] of dist) {
      const ah = Math.floor(k / 10000), dh = k % 10000;
      if (ah <= 0) aDead += p; if (dh <= 0) dDead += p; aExp += p * ah; dExp += p * dh;
    }
    return Object.assign(P, { aDead, dDead, aExp, dExp });
  };

  E.canAttack = function (s, a, d) {
    return a && d && !a.dead && !d.dead && a.fac === E.curFac(s) && d.fac !== a.fac && !a.attacked &&
      Hex.dist(a.x, a.y, d.x, d.y) === 1 && E.weapons(a).length > 0;
  };

  E.attack = function (s, a, d, wi) {
    if (!E.canAttack(s, a, d)) return { err: 'Ataque no permitido.' };
    const P = E.combatParams(s, a, d, wi); if (!P) return { err: 'Arma no válida.' };
    const ev = [{ type: 'combat', att: a.id, def: d.id, aw: P.aw, dw: P.dw }];
    let aHits = 0, dHits = 0, lastHitDmg = 0;
    const n = Math.max(P.aStr, P.dStr);
    for (let k = 0; k < n && !a.dead && !d.dead; k++) {
      if (k < P.aStr) {
        const hit = E.rand(s) * 100 < P.aCth;
        if (hit) { d.hp -= P.aDmg; aHits++; lastHitDmg = P.aDmg; }
        ev.push({ type: 'strike', from: a.id, to: d.id, hit, dmg: hit ? P.aDmg : 0, w: P.aw, hp: Math.max(0, d.hp) });
        if (d.hp <= 0) break;
      }
      if (k < P.dStr) {
        const hit = E.rand(s) * 100 < P.dCth;
        if (hit) { a.hp -= P.dDmg; dHits++; }
        ev.push({ type: 'strike', from: d.id, to: a.id, hit, dmg: hit ? P.dDmg : 0, w: P.dw, hp: Math.max(0, a.hp) });
        if (a.hp <= 0) break;
      }
    }
    a.attacked = true; a.mp = 0;
    // Efectos preparados (arm)
    if (P.arm) {
      const arm = P.arm; a.armed = null;
      if (aHits > 0 && d.hp > 0 && arm.onHit) { E.addStatus(s, d, arm.onHit, 1); ev.push({ type: 'status', id: d.id, st: arm.onHit }); }
      if (aHits > 0 && arm.steal) E.steal(s, a, d.fac, arm.steal, ev);
      if (aHits > 0 && arm.splash) {
        const others = E.neighborsIdx(s, E.uIdx(s, d)).map(i => E.unitAtIdx(s, i)).filter(x => x && x.fac !== a.fac && x !== d && !x.dead);
        if (others.length) {
          others.sort((x, y) => x.hp - y.hp);
          const o = others[0], dm = Math.max(1, Math.round(lastHitDmg * arm.splash));
          o.hp -= dm; ev.push({ type: 'splash', from: a.id, to: o.id, dmg: dm, hp: Math.max(0, o.hp) });
          if (o.hp <= 0) E.kill(s, o, a, ev, P.aw.t);
        }
      }
    }
    // Pasivas por número de golpes
    const tr = E.passive(a, 'trig');
    if (tr && tr.trig.range === P.aw.r && aHits >= tr.trig.minHits && d.hp > 0) { E.addStatus(s, d, tr.trig.status, 1); ev.push({ type: 'status', id: d.id, st: tr.trig.status }); }
    // Experiencia y bajas
    E.combatXP(s, a, d, aHits, dHits, ev, P.aw.t, P.dw ? P.dw.t : null);
    return { ev };
  };

  E.combatXP = function (s, a, d, aHits, dHits, ev, aType, dType) {
    const killXP = u => Math.max(4, 8 * E.unitLevel(u));
    const gain = (u, n) => { if (D(u).kind === 'summon' || n <= 0) return; u.xp += n; ev.push({ type: 'xp', id: u.id, n }); };
    const madBonus = u => {
      if (D(u).kind === 'summon') return 0;
      if (s.factions[u.fac].id === 'mad' && u.flags.madRound !== s.round) { u.flags.madRound = s.round; return 1; }
      return 0;
    };
    let aGain = aHits + madBonus(a), dGain = dHits + madBonus(d);
    if (d.hp <= 0 && !d.dead) { aGain += killXP(d); E.kill(s, d, a, ev, aType); } else if (d.hp > 0) dGain += 2;
    if (a.hp <= 0 && !a.dead) { dGain += killXP(a); E.kill(s, a, d, ev, dType); } else if (a.hp > 0) aGain += 2;
    if (!a.dead) { gain(a, aGain); E.checkLevel(s, a, ev); }
    if (!d.dead) { gain(d, dGain); E.checkLevel(s, d, ev); }
  };

  E.steal = function (s, u, fromFac, n, ev) {
    const f = s.factions[fromFac], amt = Math.min(n, f.gold);
    if (amt <= 0) return;
    f.gold -= amt; s.factions[u.fac].gold += amt;
    ev.push({ type: 'gold', id: u.id, n: amt, fac: u.fac });
  };

  E.kill = function (s, u, killer, ev, dmgType) {
    if (u.dead) return;
    u.dead = true; u.hp = 0;
    ev.push({ type: 'death', id: u.id, by: killer ? killer.id : null });
    if (killer && !killer.dead) {
      const io = E.passive(killer, 'onKill');
      if (io && dmgType === io.onKill.t) {
        const o = io.onKill;
        const active = s.units.filter(x => !x.dead && x.summon && x.summon.by === killer.id && x.summon.group === o.group).length;
        if (active < o.max && killer.flags.summonTurn !== s.turnIndex) {
          const spot = E.neighborsIdx(s, E.uIdx(s, killer)).find(i => E.isFree(s, i));
          if (spot != null) { killer.flags.summonTurn = s.turnIndex; E.spawnSummon(s, killer, o.minion, o.group, o.dur, spot, ev); }
        }
      }
      const kg = E.passive(killer, 'killGold');
      if (kg && killer.flags.killGoldRound !== s.round) {
        killer.flags.killGoldRound = s.round; s.factions[killer.fac].gold += kg.killGold;
        ev.push({ type: 'gold', id: killer.id, n: kg.killGold, fac: killer.fac });
      }
    }
    if (u.leader) {
      s.factions[u.fac].alive = false;
      ev.push({ type: 'eliminated', fac: u.fac });
      E.checkWinner(s, ev);
    }
  };

  E.checkLevel = function (s, u, ev) {
    if (u.dead) return;
    const nx = E.xpNext(u); if (nx == null || u.xp < nx) return;
    const d = D(u), from = u.lvl, fromName = E.unitName(u);
    u.xp -= nx;
    if (d.levels[u.lvl].xp && u.lvl < d.levels.length - 1) {
      u.lvl++; u.hp = E.maxHp(u);
      ev.push({ type: 'levelup', id: u.id, from, to: u.lvl, fromName, toName: E.unitName(u) });
    } else {
      u.vet = (u.vet || 0) + 1; u.hp = E.maxHp(u);
      ev.push({ type: 'veteran', id: u.id, vet: u.vet, name: E.unitName(u) });
    }
    if (E.xpNext(u) == null) u.xp = 0;
  };

  /* ---------- Habilidades ---------- */
  E.abilityState = function (s, u, id) {
    const A = VV.ABIL[id];
    if (!A || A.kind === 'passive') return { ok: false, why: 'Pasiva' };
    if (u.fac !== E.curFac(s)) return { ok: false, why: 'No es tu turno' };
    if (u.fresh) return { ok: false, why: 'Recién llegada' };
    if (E.hasStatus(u, 'silenciado')) return { ok: false, why: 'Silenciado' };
    if (A.once && u.used[id]) return { ok: false, why: 'Ya usada en esta batalla' };
    if (u.cd[id] > 0) return { ok: false, why: 'Recarga: ' + u.cd[id] + ' turno' + (u.cd[id] > 1 ? 's' : '') };
    if (A.kind === 'arm' && u.armed) return { ok: false, why: 'Ya preparada' };
    if (A.kind !== 'arm' && u.attacked) return { ok: false, why: 'Ya ha actuado' };
    const T = E.abilityTargets(s, u, id);
    if (T.mode !== 'self' && !T.list.length) return { ok: false, why: 'Sin objetivos válidos' };
    return { ok: true };
  };

  E.abilityTargets = function (s, u, id) {
    const A = VV.ABIL[id], here = E.uIdx(s, u);
    const adj = E.neighborsIdx(s, here);
    const enemyAt = i => { const x = E.unitAtIdx(s, i); return x && x.fac !== u.fac ? x : null; };
    switch (A.kind) {
      case 'arm': case 'buff': case 'heal': return { mode: 'self', list: [] };
      case 'healAlly': return { mode: 'tiles', list: adj.filter(i => { const x = E.unitAtIdx(s, i); return x && x.fac === u.fac && x.hp < E.maxHp(x); }), need: 1 };
      case 'debuff': return { mode: 'tiles', list: adj.filter(i => enemyAt(i)), need: 1 };
      case 'summon': {
        const L = adj.filter(i => E.isFree(s, i));
        const active = s.units.filter(x => !x.dead && x.summon && x.summon.by === u.id && x.summon.group === A.group).length;
        return { mode: 'tiles', list: (active < A.max || A.replace) ? L : [], need: 1 };
      }
      case 'barricade': {
        const active = Object.values(s.obstacles).filter(o => o.by === u.id).length;
        const room = Math.max(0, Math.min(A.count, A.maxActive - active));
        return { mode: room > 1 ? 'multi' : 'tiles', list: room ? adj.filter(i => E.isFree(s, i)) : [], need: room };
      }
      case 'sticky': return { mode: 'tiles', list: adj.filter(i => E.isFree(s, i) && !(s.overlays[i] && s.overlays[i].sticky)), need: 1 };
      case 'leap': {
        const L = [];
        for (let i = 0; i < s.tiles.length; i++) {
          const dd = E.distIdx(s, here, i);
          if (dd < 1 || dd > A.range || !E.isFree(s, i)) continue;
          if (dd === 2) {
            const mids = adj.filter(m => E.distIdx(s, m, i) === 1);
            if (!mids.some(m => VV.TERRAIN[s.tiles[m].t].cost < 99 && !s.obstacles[m])) continue;
          }
          if (A.then && A.then !== 'normal') {
            if (!E.neighborsIdx(s, i).some(n => enemyAt(n))) continue;
          }
          L.push(i);
        }
        return { mode: 'leap', list: L, need: 1 };
      }
      case 'attack': {
        if (A.target === 'all_adj') { const L = adj.filter(i => enemyAt(i)); return { mode: 'self', list: L, auto: L }; }
        if (A.target === 'radius2') {
          const L = []; for (const x of s.units) if (!x.dead && x.fac !== u.fac && Hex.dist(u.x, u.y, x.x, x.y) <= 2) L.push(E.uIdx(s, x));
          return { mode: 'self', list: L, auto: L };
        }
        if (A.target === 'range2') {
          const L = [];
          for (const x of s.units) {
            if (x.dead || x.fac === u.fac) continue;
            const dd = Hex.dist(u.x, u.y, x.x, x.y);
            if (dd < 1 || dd > 2) continue;
            if (dd === 2) {
              const ti = E.uIdx(s, x), mids = adj.filter(m => E.distIdx(s, m, ti) === 1);
              if (!mids.some(m => s.tiles[m].t !== 'wall')) continue;
            }
            L.push(E.uIdx(s, x));
          }
          return { mode: 'tiles', list: L, need: 1 };
        }
        if (A.target === 'two') return { mode: 'multi', list: adj.filter(i => enemyAt(i)), need: 2 };
        return { mode: 'tiles', list: adj.filter(i => enemyAt(i)), need: 1 };
      }
    }
    return { mode: 'self', list: [] };
  };

  E.spawnSummon = function (s, owner, minionId, group, dur, spot, ev) {
    const up = E.passive(owner, 'upgrade');
    if (up && up.upgrade[minionId]) minionId = up.upgrade[minionId];
    const [c, r] = CR(s, spot);
    const m = E.makeUnit(s, minionId, owner.fac, c, r, { summon: { by: owner.id, group, until: s.turnIndex + s.order.length * dur } });
    m.mp = 0; m.attacked = true;
    ev.push({ type: 'summon', id: m.id, by: owner.id });
    return m;
  };

  // Golpes de una habilidad ofensiva (sin contraataque)
  function specialStrikes(s, u, target, dmg, type, str, ev, acc, w) {
    let hits = 0;
    for (let k = 0; k < str && !target.dead; k++) {
      const hit = E.rand(s) * 100 < E.cth(s, u, target, acc || 0);
      const dm = hit ? E.damage(s, u, target, dmg, type, w || { r: 'x' }) : 0;
      if (hit) { target.hp -= dm; hits++; }
      ev.push({ type: 'strike', from: u.id, to: target.id, hit, dmg: dm, w: { t: type, fx: null }, hp: Math.max(0, target.hp), special: true });
      if (target.hp <= 0) break;
    }
    return hits;
  }

  E.pushUnit = function (s, a, d, ev) {
    if (d.dead) return;
    const ca = Hex.toCube(a.x, a.y), cd = Hex.toCube(d.x, d.y);
    const [nc, nr] = Hex.fromCube(2 * cd[0] - ca[0], 2 * cd[1] - ca[1], 2 * cd[2] - ca[2]);
    if (!inB(s, nc, nr)) return;
    const ni = I(s, nc, nr);
    if (!E.isFree(s, ni) || E.moveCost(s, d, ni) >= 99) return;
    const from = E.uIdx(s, d); d.x = nc; d.y = nr;
    ev.push({ type: 'push', id: d.id, from, to: ni });
  };

  E.useAbility = function (s, u, id, targets) {
    targets = targets || [];
    const st = E.abilityState(s, u, id);
    if (!st.ok) return { err: st.why };
    const A = VV.ABIL[id], T = E.abilityTargets(s, u, id);
    for (const t of (A.kind === 'leap' ? targets.slice(0, 1) : targets)) if (!T.list.includes(t)) return { err: 'Objetivo no válido.' };
    if (T.mode !== 'self' && targets.length < 1) return { err: 'Falta el objetivo.' };
    const ev = [{ type: 'ability', id: u.id, abil: id }];
    const enemyAt = i => { const x = E.unitAtIdx(s, i); return x && x.fac !== u.fac ? x : null; };
    const offensive = A.kind === 'attack' || A.kind === 'debuff';
    let xpGain = 0;
    switch (A.kind) {
      case 'arm': u.armed = Object.assign({ src: id }, A.arm); break;
      case 'buff':
        if (A.status) { E.addStatus(s, u, A.status, 1); ev.push({ type: 'status', id: u.id, st: A.status }); }
        if (A.evasion) { E.addStatus(s, u, 'evasivo', 1, A.evasion); ev.push({ type: 'status', id: u.id, st: 'evasivo' }); }
        break;
      case 'heal': { const h = Math.min(A.amount, E.maxHp(u) - u.hp); u.hp += h; ev.push({ type: 'heal', id: u.id, n: h }); break; }
      case 'healAlly': { const x = E.unitAtIdx(s, targets[0]); const h = Math.min(A.amount, E.maxHp(x) - x.hp); x.hp += h; ev.push({ type: 'heal', id: x.id, n: h }); xpGain = 1; break; }
      case 'debuff': { const x = enemyAt(targets[0]); E.addStatus(s, x, A.status, 1); ev.push({ type: 'status', id: x.id, st: A.status, from: u.id });
        if (A.arm) u.armed = Object.assign({ src: id }, A.arm); xpGain = 1; break; }
      case 'summon': {
        if (A.replace) s.units.forEach(x => { if (!x.dead && x.summon && x.summon.by === u.id && x.summon.group === A.group) { x.dead = true; ev.push({ type: 'vanish', id: x.id }); } });
        const m = E.spawnSummon(s, u, A.minion, A.group, A.dur, targets[0], ev);
        if (A.inspireOnEnter) E.living(s).forEach(x => { if (x.fac === u.fac && x !== m && Hex.dist(x.x, x.y, m.x, m.y) <= A.inspireOnEnter) { E.addStatus(s, x, 'inspirado', 1); ev.push({ type: 'status', id: x.id, st: 'inspirado' }); } });
        break;
      }
      case 'barricade':
        for (const t of targets.slice(0, T.need)) {
          s.obstacles[t] = { kind: 'barricade', hp: A.hp, max: A.hp, owner: u.fac, by: u.id, until: s.turnIndex + s.order.length * A.dur };
          ev.push({ type: 'barricade', at: t, by: u.id });
        }
        break;
      case 'sticky':
        s.overlays[targets[0]] = Object.assign(s.overlays[targets[0]] || {}, { sticky: s.turnIndex + s.order.length * 2 });
        ev.push({ type: 'sticky', at: targets[0], by: u.id });
        break;
      case 'leap': {
        const from = E.uIdx(s, u), [c, r] = CR(s, targets[0]);
        u.x = c; u.y = r; if (!A.free) u.mp = 0; u.moved = true;
        ev.push({ type: 'leap', id: u.id, from, to: targets[0], fx: A.fx });
        const t = s.tiles[targets[0]];
        if (t.prop >= 0 && s.props[t.prop].owner !== u.fac) { const pr = s.props[t.prop].owner; s.props[t.prop].owner = u.fac; ev.push({ type: 'capture', id: u.id, prop: t.prop, from: pr }); }
        if (A.then && A.then !== 'normal') {
          const tgt = targets[1] != null ? enemyAt(targets[1]) : null;
          const cand = tgt && Hex.dist(tgt.x, tgt.y, u.x, u.y) === 1 ? tgt :
            E.neighborsIdx(s, targets[0]).map(enemyAt).filter(Boolean).sort((a, b) => a.hp - b.hp)[0];
          if (cand) {
            const h = specialStrikes(s, u, cand, A.then.d, A.then.t, A.then.s, ev);
            xpGain += h + 2; E.afterSpecial(s, u, [cand], ev, A.then.t);
          }
          u.attacked = true;
        }
        break;
      }
      case 'attack': {
        let tlist;
        if (A.target === 'all_adj' || A.target === 'radius2') tlist = T.auto.map(enemyAt).filter(Boolean);
        else tlist = targets.map(enemyAt).filter(Boolean).slice(0, A.target === 'two' ? 2 : 1);
        if (!tlist.length) return { err: 'Sin objetivos.' };
        let healHits = 0;
        for (const tgt of tlist) {
          let dmg, type, str, w = null;
          if (A.custom) { dmg = A.custom.d; type = A.custom.t; str = A.custom.s; }
          else { w = E.weapons(u).find(x => x.r === A.weapon) || E.weapons(u)[0]; dmg = w.d; type = w.t; str = w.s; }
          ev.push({ type: 'specialHit', id: u.id, to: tgt.id, fx: A.fx });
          let hits = specialStrikes(s, u, tgt, dmg, type, str, ev, 0, w);
          if (A.extraPerSummon && !tgt.dead) {
            const friends = s.units.filter(x => !x.dead && x.summon && x.summon.by === u.id && x.summon.group === A.extraPerSummon.group);
            for (const f of friends) {
              if (tgt.dead) break;
              const hit = E.rand(s) * 100 < E.cth(s, f, tgt, 0);
              const dm = hit ? E.damage(s, f, tgt, A.extraPerSummon.d, A.extraPerSummon.t) : 0;
              if (hit) { tgt.hp -= dm; hits++; }
              ev.push({ type: 'strike', from: f.id, to: tgt.id, hit, dmg: dm, w: { t: 'imp', fx: 'fist' }, hp: Math.max(0, tgt.hp), special: true });
            }
          }
          xpGain += hits;
          if (hits > 0) healHits++;
          if (!tgt.dead && tgt.hp > 0) {
            if (A.onHit && hits > 0) { E.addStatus(s, tgt, A.onHit, 1); ev.push({ type: 'status', id: tgt.id, st: A.onHit }); }
            if (A.minHits && hits >= A.minHits) { E.addStatus(s, tgt, A.minStatus, 1); ev.push({ type: 'status', id: tgt.id, st: A.minStatus }); }
            if (A.push && hits > 0) E.pushUnit(s, u, tgt, ev);
          }
          if (A.sticky) {
            const spots = E.neighborsIdx(s, E.uIdx(s, tgt)).filter(i => E.isFree(s, i)).slice(0, A.sticky);
            for (const sp of spots) { s.overlays[sp] = Object.assign(s.overlays[sp] || {}, { sticky: s.turnIndex + s.order.length * 2 }); ev.push({ type: 'sticky', at: sp, by: u.id }); }
          }
        }
        if (A.healPerTarget && healHits) { const h = Math.min(A.healMax, A.healPerTarget * healHits, E.maxHp(u) - u.hp); if (h > 0) { u.hp += h; ev.push({ type: 'heal', id: u.id, n: h }); } }
        xpGain += 2;
        E.afterSpecial(s, u, tlist, ev, A.custom ? A.custom.t : (E.weapons(u).find(x => x.r === A.weapon) || {}).t);
        break;
      }
    }
    if (A.cd) u.cd[id] = A.cd;
    if (A.once) u.used[id] = true;
    if (A.kind !== 'arm' && !(A.kind === 'leap' && A.then === 'normal')) u.attacked = true;
    if (offensive) u.mp = 0;
    if (xpGain && !u.dead) { u.xp += xpGain; ev.push({ type: 'xp', id: u.id, n: xpGain }); E.checkLevel(s, u, ev); }
    return { ev };
  };

  E.afterSpecial = function (s, u, tlist, ev, type) {
    for (const t of tlist) {
      if (t.hp <= 0 && !t.dead) { u.xp += Math.max(4, 8 * E.unitLevel(t)); E.kill(s, t, u, ev, type); }
      else if (!t.dead && D(t).kind !== 'summon') { t.xp += 2; E.checkLevel(s, t, ev); }
    }
  };

  // Romper mesas o barricadas enemigas: los objetos no esquivan.
  E.canBreak = function (s, u, i) {
    const o = s.obstacles[i];
    if (!o || u.attacked || u.fac !== E.curFac(s) || u.fresh) return false;
    if (E.distIdx(s, E.uIdx(s, u), i) !== 1) return false;
    if (o.owner === u.fac) return false;
    if (o.kind === 'tables') return E.weapons(u).some(w => w.t === 'imp' && w.r === 'm');
    return E.weapons(u).length > 0;
  };
  E.breakObstacle = function (s, u, i) {
    if (!E.canBreak(s, u, i)) return { err: 'No puede romper ese obstáculo.' };
    const o = s.obstacles[i];
    const ws = E.weapons(u).filter(w => o.kind !== 'tables' || (w.t === 'imp' && w.r === 'm'));
    const w = ws.sort((a, b) => b.d * b.s - a.d * a.s)[0];
    const dmg = Math.round(w.d * w.s * E.todMul(s, u));
    o.hp -= dmg; u.attacked = true; u.mp = 0;
    const ev = [{ type: 'smash', id: u.id, at: i, dmg, w }];
    if (o.hp <= 0) { delete s.obstacles[i]; ev.push({ type: 'obstacleGone', at: i, kind: o.kind }); }
    return { ev };
  };

  /* ---------- Reclutamiento ---------- */
  E.castleTiles = function (s, keepIdx) {
    const seen = new Set([keepIdx]), q = [keepIdx], out = [];
    while (q.length) {
      const i = q.shift();
      for (const n of E.neighborsIdx(s, i)) {
        if (seen.has(n)) continue;
        if (VV.TERRAIN[s.tiles[n].t].castle) { seen.add(n); q.push(n); out.push(n); }
      }
    }
    return out;
  };
  E.recruitSpots = function (s, fac) {
    const f = s.factions[fac], L = E.byId(s, f.leaderId);
    if (!L || s.tiles[E.uIdx(s, L)].t !== 'keep') return [];
    return E.castleTiles(s, E.uIdx(s, L)).filter(i => E.isFree(s, i));
  };
  E.recruitList = function (s, fac) {
    const f = s.factions[fac], fd = VV.FACTIONS[f.id];
    const list = [];
    VV.HEROES[f.id].forEach(id => list.push({ id, unique: true, avail: true }));
    fd.generics.forEach(id => list.push({ id, unique: false, avail: true }));
    return list.map(x => Object.assign(x, { cost: VV.UNITS[x.id].cost }));
  };
  E.recruit = function (s, fac, defId, spot) {
    if (fac !== E.curFac(s)) return { err: 'No es tu turno.' };
    const f = s.factions[fac], ud = VV.UNITS[defId];
    if (!ud || ud.fac !== f.id || ud.kind === 'summon') return { err: 'Unidad no reclutable.' };
    if (f.gold < ud.cost) return { err: 'Oro insuficiente.' };
    const spots = E.recruitSpots(s, fac);
    if (!spots.length) return { err: 'El comandante debe estar en la casilla de mando con espacio libre.' };
    if (spot == null) spot = spots[0];
    if (!spots.includes(spot)) return { err: 'Casilla de reclutamiento no válida.' };
    f.gold -= ud.cost;
    if (ud.kind === 'hero') f.uniques.push(defId);
    const [c, r] = CR(s, spot);
    const u = E.makeUnit(s, defId, fac, c, r);
    u.mp = 0; u.attacked = true;
    return { ev: [{ type: 'recruit', id: u.id, fac }], unit: u };
  };

  /* ---------- Economía ---------- */
  E.income = function (s, fac) {
    const f = s.factions[fac];
    const props = s.props.filter(p => p.owner === fac);
    const propGold = props.reduce((a, p) => a + p.gold, 0);
    const bonus = f.id === 'ver' ? Math.floor(props.length / 2) : 0;
    const upkeep = E.living(s).filter(u => u.fac === fac && !u.leader && !u.summon).reduce((a, u) => a + E.unitLevel(u), 0);
    return { base: VV.ECON.base, props: propGold, nprops: props.length, bonus, upkeep, total: VV.ECON.base + propGold + bonus - upkeep };
  };

  /* ---------- Turnos ---------- */
  E.beginTurn = function (s, ev) {
    s.turnIndex++;
    const fac = E.curFac(s), f = s.factions[fac];
    // Caducidades globales
    for (const u of s.units) if (!u.dead) u.st = u.st.filter(x => x.until > s.turnIndex);
    for (const u of s.units) if (!u.dead && u.summon && u.summon.until <= s.turnIndex) { u.dead = true; ev.push({ type: 'vanish', id: u.id }); }
    for (const k of Object.keys(s.obstacles)) if (s.obstacles[k].until <= s.turnIndex) { ev.push({ type: 'obstacleGone', at: +k, kind: s.obstacles[k].kind }); delete s.obstacles[k]; }
    for (const k of Object.keys(s.overlays)) {
      const o = s.overlays[k];
      if (o.sticky && o.sticky <= s.turnIndex) delete o.sticky;
      if (o.puddle && o.puddle <= s.turnIndex) delete o.puddle;
      if (!o.sticky && !o.puddle) delete s.overlays[k];
    }
    // Ingresos (desde la segunda ronda)
    if (s.round > 1 && f.alive) {
      const inc = E.income(s, fac);
      f.gold = Math.max(0, f.gold + inc.total);
      ev.push({ type: 'income', fac, n: inc.total });
    }
    for (const u of s.units) {
      if (u.dead || u.fac !== fac) continue;
      u.fresh = false;
      for (const k in u.cd) if (u.cd[k] > 0) u.cd[k]--;
      // Curación
      const t = s.tiles[E.uIdx(s, u)];
      let heal = 0;
      if (t.prop >= 0 && s.props[t.prop].heal) { heal = s.props[t.prop].heal; if (f.id === 'ast' && s.props[t.prop].owner === fac) heal += 1; }
      else if (u.rested) heal = 2;
      heal = Math.min(heal, f.id === 'ast' ? 9 : 8, E.maxHp(u) - u.hp);
      if (heal > 0) { u.hp += heal; ev.push({ type: 'heal', id: u.id, n: heal }); }
      // Afinidad con las barricas (Tío Guillermo)
      const tp = E.passive(u, 'tavernXP');
      if (tp && t.prop >= 0 && s.props[t.prop].bar && s.props[t.prop].owner === fac && (u.flags.tavernRound == null || s.round - u.flags.tavernRound >= 2)) {
        u.flags.tavernRound = s.round; u.xp += tp.tavernXP; ev.push({ type: 'xp', id: u.id, n: tp.tavernXP }); E.checkLevel(s, u, ev);
      }
      u.mp = Math.max(0, E.maxMov(u) + (E.hasStatus(u, 'agotado') ? -1 : 0) + (E.hasStatus(u, 'temazo') ? 1 : 0));
      u.attacked = false; u.moved = false; u.flags.skirmUsed = false;
    }
    ev.push({ type: 'turn', fac, round: s.round });
    return ev;
  };

  E.endTurn = function (s) {
    const ev = [];
    if (s.winner != null) return { ev };
    const fac = E.curFac(s);
    for (const u of s.units) if (!u.dead && u.fac === fac) u.rested = !u.moved && !u.attacked;
    s.units = s.units.filter(u => !u.dead);
    // Siguiente facción viva
    let guard = 0;
    do {
      s.cur++;
      if (s.cur >= s.order.length) { s.cur = 0; E.endRound(s, ev); if (s.winner != null) return { ev }; }
    } while (!s.factions[E.curFac(s)].alive && ++guard < 10);
    E.beginTurn(s, ev);
    return { ev };
  };

  E.endRound = function (s, ev) {
    // Dominio de la Villa
    if (s.mode === 'domination') {
      s.factions.forEach((f, i) => {
        if (!f.alive) return;
        const n = s.props.filter(p => p.owner === i).length;
        s.dom[i] = n >= 4 ? (s.dom[i] || 0) + 1 : 0;
        if (s.dom[i] >= 2 && s.winner == null) { s.winner = i; ev.push({ type: 'win', fac: i, why: 'Dominio de la Villa' }); }
      });
      if (s.winner != null) return;
    }
    if (s.round >= s.roundLimit) {
      const sc = s.factions.map((f, i) => E.score(s, i));
      let bi = 0; sc.forEach((x, i) => { if (x.total > sc[bi].total) bi = i; });
      s.winner = bi; ev.push({ type: 'win', fac: bi, why: 'Límite de rondas: puntuación', scores: sc });
      return;
    }
    s.round++;
    ev.push({ type: 'round', round: s.round, tod: E.tod(s) });
    E.runEvents(s, ev);
  };

  E.score = function (s, fac) {
    const props = s.props.filter(p => p.owner === fac).length;
    const units = E.living(s).filter(u => u.fac === fac && !u.summon);
    const levels = units.reduce((a, u) => a + E.unitLevel(u), 0);
    const gold = s.factions[fac].gold;
    return { props, units: units.length, levels, gold, total: props * 10 + units.length * 5 + levels * 4 + Math.floor(gold / 5) };
  };
  E.SCORE_FORMULA = '10 × propiedades + 5 × unidades vivas + 4 × niveles + oro ÷ 5';

  E.checkWinner = function (s, ev) {
    const alive = s.factions.map((f, i) => (f.alive ? i : -1)).filter(i => i >= 0);
    if (alive.length === 1 && s.winner == null) { s.winner = alive[0]; ev.push({ type: 'win', fac: alive[0], why: 'Comandante enemigo derrotado' }); }
  };

  /* ---------- Eventos del escenario ---------- */
  E.upcomingEvent = function (s) {
    for (let r = s.round; r <= s.round + 5; r++) { const e = VV.eventsForRound(s.mapId, r); if (e.length) return { round: r, ids: e }; }
    return null;
  };
  E.runEvents = function (s, ev) {
    const M = VV.MAPS[s.mapId], ids = VV.eventsForRound(s.mapId, s.round);
    const nf = s.order.length;
    for (const id of ids) {
      const hit = [];
      if (id === 'mercau') {
        const p = s.props.find(x => x.kind === 'abastos');
        if (p && p.owner >= 0) { s.factions[p.owner].gold += 3; hit.push({ fac: p.owner, gold: 3 }); }
      } else if (id === 'orbayu') {
        const streets = []; s.tiles.forEach((t, i) => { if (t.t === 'street' && !E.unitAtIdx(s, i)) streets.push(i); });
        const pick = []; const pool = streets.slice();
        for (let k = 0; k < 10 && pool.length; k++) pick.push(pool.splice(Math.floor(E.rand(s) * pool.length), 1)[0]);
        pick.forEach(i => { s.overlays[i] = Object.assign(s.overlays[i] || {}, { puddle: s.turnIndex + nf * 2 + 1 }); });
        hit.push({ tiles: pick });
      } else if (id === 'campanada' || id === 'subidon') {
        const c = id === 'campanada' ? M.teatro : M.stage;
        E.living(s).forEach(u => { if (Hex.dist(u.x, u.y, c[0], c[1]) <= 2) { E.addStatus(s, u, 'inspirado', 1); hit.push({ id: u.id, st: 'inspirado' }); } });
      } else if (id === 'charanga') {
        E.living(s).forEach(u => { if (u.y === M.charanga) { E.addStatus(s, u, 'mareado', 1); hit.push({ id: u.id, st: 'mareado' }); } });
      } else if (id === 'temazo') {
        E.living(s).forEach(u => { if (s.tiles[E.uIdx(s, u)].t === 'dance') { E.addStatus(s, u, 'temazo', 1); hit.push({ id: u.id, st: 'temazo' }); } });
      } else if (id === 'barralibre') {
        const bars = new Set();
        s.props.forEach(p => { if (p.bar) { const i = I(s, p.c, p.r); bars.add(i); E.neighborsIdx(s, i).forEach(n => bars.add(n)); } });
        E.living(s).forEach(u => { if (bars.has(E.uIdx(s, u))) { const h = Math.min(3, E.maxHp(u) - u.hp); if (h > 0) { u.hp += h; hit.push({ id: u.id, heal: h }); } } });
      }
      ev.push({ type: 'event', ev: id, hit });
    }
  };

  /* ---------- Acción genérica (usada por la IA y la interfaz) ---------- */
  E.perform = function (s, a) {
    if (s.winner != null) return { err: 'Partida terminada.' };
    const u = a.unit != null ? E.byId(s, a.unit) : null;
    switch (a.type) {
      case 'move': return u ? E.moveUnit(s, u, a.to) : { err: 'Sin unidad' };
      case 'attack': { const d = E.byId(s, a.target); return u && d ? E.attack(s, u, d, a.weapon) : { err: 'Sin objetivo' }; }
      case 'ability': return u ? E.useAbility(s, u, a.abil, a.targets) : { err: 'Sin unidad' };
      case 'recruit': return E.recruit(s, E.curFac(s), a.def, a.spot);
      case 'break': return u ? E.breakObstacle(s, u, a.at) : { err: 'Sin unidad' };
      case 'end': return E.endTurn(s);
    }
    return { err: 'Acción desconocida' };
  };

  /* ---------- Guardado ---------- */
  E.serialize = s => JSON.stringify(s);
  E.deserialize = function (str) {
    const s = JSON.parse(str);
    if (!s || !s.tiles || !s.units || !s.factions) throw new Error('Partida dañada');
    // Las claves numéricas de objetos vuelven como texto: se normalizan.
    const ob = {}; for (const k in s.obstacles) ob[+k] = s.obstacles[k]; s.obstacles = ob;
    const ov = {}; for (const k in s.overlays) ov[+k] = s.overlays[k]; s.overlays = ov;
    return s;
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* LA BATALLA POR VILLAVICIOSA — ai.js
   IA táctica: evalúa ataques (distribución exacta de PV), habilidades, captura,
   amenazas, economía y protección del comandante. Juega con las mismas reglas
   que el jugador: todas sus acciones pasan por Engine.perform. */
(function (G) {
  const VV = G.VV, E = VV.Engine, Hex = VV.Hex;
  const AI = (VV.AI = {});
  const mem = { turn: -1, pending: null, done: new Set(), recruits: 0 };

  const DIFF = {
    easy: { self: 0.45, threat: 0, noise: 0.35, lookAll: false, minScore: -2 },
    normal: { self: 0.8, threat: 0.35, noise: 0.06, lookAll: true, minScore: 0 },
    hard: { self: 1.0, threat: 0.7, noise: 0, lookAll: true, minScore: 0.5 }
  };

  function hash(a, b, c) { let h = (a * 73856093) ^ (b * 19349663) ^ (c * 83492791); h = Math.imul(h ^ (h >>> 13), 0x5bd1e995); return ((h ^ (h >>> 15)) >>> 0) / 4294967296; }
  function noise(s, u, k, amp) { return amp ? 1 + (hash(s.turnIndex, u.id, k) * 2 - 1) * amp : 1; }

  function value(u) {
    if (u.leader) return 260;
    const d = E.def(u);
    if (d.kind === 'summon') return 9;
    return (d.cost || 14) * (1 + 0.45 * u.lvl);
  }

  function threatMap(s, fac) {
    const th = new Float32Array(s.tiles.length);
    for (const e of s.units) {
      if (e.dead || e.fac === fac) continue;
      const reach = E.reachable(s, e, E.maxMov(e));
      const best = Math.max(0, ...E.weapons(e).map(w => w.d * w.s * 0.6));
      const seen = new Set();
      for (const i of reach.keys()) for (const n of E.neighborsIdx(s, i)) seen.add(n);
      seen.add(E.uIdx(s, e));
      for (const i of seen) th[i] += best;
    }
    return th;
  }

  // Evalúa con la unidad colocada provisionalmente en «dest»
  function at(s, u, dest, fn) {
    const ox = u.x, oy = u.y; const [c, r] = E.cr(s, dest);
    u.x = c; u.y = r;
    try { return fn(); } finally { u.x = ox; u.y = oy; }
  }

  function binomAtLeast(n, p, k) {
    let tot = 0;
    for (let i = k; i <= n; i++) { let c = 1; for (let j = 0; j < i; j++) c = c * (n - j) / (j + 1); tot += c * Math.pow(p, i) * Math.pow(1 - p, n - i); }
    return tot;
  }

  function scoreAttack(s, u, d, wi, dest, cfg, th) {
    const P = at(s, u, dest, () => E.predict(s, u, d, wi));
    if (!P) return null;
    const vd = value(d), vu = value(u);
    const dealt = d.hp - P.dExp, taken = u.hp - P.aExp;
    let sc = dealt / E.maxHp(d) * vd * 0.55 + P.dDead * vd * 0.85 - (taken / E.maxHp(u)) * vu * cfg.self * 0.55 - P.aDead * vu * 1.25 * cfg.self;
    sc += at(s, u, dest, () => E.defense(s, u)) * 0.06;
    if (th) sc -= (th[dest] / E.maxHp(u)) * vu * cfg.threat * 0.25;
    if (u.leader) sc -= P.aDead * 400 + (th ? th[dest] : 0) * 0.6;
    const nx = E.xpNext(u);
    if (nx && P.dDead > 0.3 && u.xp + 8 >= nx) sc += 6;
    return { sc, P };
  }

  // Valor aproximado de una habilidad ofensiva desde «dest»
  function scoreAbility(s, u, id, dest, cfg) {
    const A = VV.ABIL[id];
    return at(s, u, dest, () => {
      const st = E.abilityState(s, u, id);
      if (!st.ok) return null;
      const T = E.abilityTargets(s, u, id);
      const tgts = (T.auto || T.list).map(i => E.unitAtIdx(s, i)).filter(x => x && x.fac !== u.fac);
      if (A.kind === 'debuff') {
        if (!tgts.length) return null;
        const t = tgts.sort((a, b) => value(b) - value(a))[0];
        return { sc: 4 + value(t) * 0.04, targets: [E.uIdx(s, t)] };
      }
      if (A.kind !== 'attack') return null;
      let list = tgts;
      if (A.target === 'two') list = tgts.sort((a, b) => a.hp - b.hp).slice(0, 2);
      else if (A.target === 'adj' || A.target === 'range2') list = tgts.sort((a, b) => a.hp - b.hp).slice(0, 1);
      if (!list.length) return null;
      let sc = 0;
      for (const t of list) {
        let dmg, type, str;
        if (A.custom) { dmg = A.custom.d; type = A.custom.t; str = A.custom.s; }
        else { const w = E.weapons(u).find(x => x.r === A.weapon) || E.weapons(u)[0]; dmg = w.d; type = w.t; str = w.s; }
        const dm = E.damage(s, u, t, dmg, type), p = E.cth(s, u, t, 0) / 100;
        let extra = 0;
        if (A.extraPerSummon) extra = s.units.filter(x => !x.dead && x.summon && x.summon.by === u.id).length;
        const need = Math.ceil(t.hp / dm);
        const pk = binomAtLeast(str + extra, p, Math.min(need, str + extra + 1));
        const exp = Math.min(t.hp, (str * dm + extra * 5) * p);
        sc += exp / E.maxHp(t) * value(t) * 0.55 + pk * value(t) * 0.85 + (A.onHit || A.minStatus ? 3 : 0) + (A.push ? 1 : 0);
      }
      return { sc: sc * (A.ult ? 0.95 : 1), targets: list.map(t => E.uIdx(s, t)) };
    });
  }

  function recruitChoice(s, fac, cfg) {
    const f = s.factions[fac];
    const list = E.recruitList(s, fac).filter(x => x.avail && x.cost <= f.gold);
    if (!list.length) return null;
    const dmgMix = { imp: 0, cut: 0, pro: 0, psi: 0, cha: 0 };
    E.living(s).forEach(u => { if (u.fac !== fac) E.weapons(u).forEach(w => (dmgMix[w.t] += w.d * w.s)); });
    const tot = Object.values(dmgMix).reduce((a, b) => a + b, 0) || 1;
    const mine = E.living(s).filter(u => u.fac === fac);
    let best = null, bv = -1e9;
    for (const x of list) {
      const d = VV.UNITS[x.id], L = d.levels[0];
      const res = Object.assign({}, VV.RES[d.arch], d.res || {});

    if (H.recruit) H.recruit.forEach(i => hexFill(ctx, i, 'rgba(90,220,255,0.28)', '#5ad8ff', 2));
    if (H.abil) H.abil.forEach(i => hexFill(ctx, i, 'rgba(255,205,60,0.28)', '#ffcd3c', 2.5));
    if (H.picked) H.picked.forEach(i => hexFill(ctx, i, 'rgba(255,120,40,0.4)', '#ff7a28', 3));
    if (H.threat) H.threat.forEach(i => hexFill(ctx, i, 'rgba(220,50,40,0.16)'));
    if (H.hoverThreat) H.hoverThreat.forEach(i => hexFill(ctx, i, 'rgba(220,50,40,0.13)'));
    if (H.attack) H.attack.forEach(i => hexFill(ctx, i, 'rgba(255,75,58,0.18)', '#ff4b3a', 3));
    if (H.area) H.area.forEach(i => hexFill(ctx, i, 'rgba(255,80,60,0.18)'));

    if (R.hover >= 0) hexFill(ctx, R.hover, null, 'rgba(255,255,255,0.7)', 1.5);
    // obstáculos y unidades ordenados por profundidad
    const draws = [];
    s.props.forEach(p => { const [x, y] = ART.hexCenter(p.c, p.r); draws.push({ y: y + 15, f: () => drawFlag(ctx, s, p, x, y, t) }); });
    for (const k in s.obstacles) { const i = +k, o = s.obstacles[k], [x, y] = ART.hexCenter(i % s.W, Math.floor(i / s.W)); draws.push({ y, f: () => drawObstacle(ctx, o, x, y) }); }
    for (const u of s.units) {
      const v = R.visOf(u);

      if (!v.lock) { const [hx, hy] = ART.hexCenter(u.x, u.y); v.x += (hx - v.x) * 0.25; v.y += (hy - v.y) * 0.25; }

    // tinte día/noche
    if (R.tintT) { const p = Math.max(0, Math.min(1, (t - R.tintT.t0) / R.tintT.dur)); R.tint = R.tintT.from.map((a, k) => a + (R.tintT.to[k] - a) * p); if (p >= 1) R.tintT = null; }

        for (const [lx, ly, rad] of R.lights) { const gr = ctx.createRadialGradient(lx, ly, 0, lx, ly, rad); gr.addColorStop(0, `rgba(255,190,100,${0.42 * night})`); gr.addColorStop(1, 'rgba(255,190,100,0)'); ctx.fillStyle = gr; ctx.fillRect(lx - rad, ly - rad, rad * 2, rad * 2); }

    }
    // partículas, proyectiles y textos
    for (let k = R.parts.length - 1; k >= 0; k--) {
      const p = R.parts[k]; p.life += 16; p.x += p.vx; p.y += p.vy; p.vy += p.grav;
      if (p.life > p.max) { R.parts.splice(k, 1); continue; }

        if (p.kind.startsWith('hamster') && Math.random() < 0.8) R.part(x, y, ['#ffd54f', '#fff59d'], 1, { speed: 0.3, life: 400, up: 0, grav: 0 });

      ctx.strokeText(f.text, f.x, f.y - q * 34); ctx.fillStyle = f.col; ctx.fillText(f.text, f.x, f.y - q * 34);

    ctx.globalAlpha = 1;
  };

  function drawFlag(ctx, s, p, x, y, t) {
    const own = p.owner >= 0, F = own ? VV.FACTIONS[s.factions[p.owner].id] : null;
    const px = x + 20, top = y - 74, base = y - 26, w = 26, h = 17;
    ctx.fillStyle = '#1a120c'; ctx.fillRect(px - 1, top - 2, 4, base - top + 2); ctx.fillStyle = '#7a5a3a'; ctx.fillRect(px, top, 2, base - top);
    ctx.fillStyle = '#d9a62e'; ctx.fillRect(px - 1, top - 4, 4, 3);

  }

  const tintCache = new Map();

    hex: ['#ffca28', '#66bb6a', '#8d6e63'], toxic: ['#76ff03', '#b2ff59'], violet: ['#b388ff', '#7c4dff'], violet2: ['#b388ff', '#7c4dff', '#ea80fc'],

  function drawUnit(ctx, u, v, t) {

  }

  function drawSpecials(ctx, t) {
    for (let k = R.specials.length - 1; k >= 0; k--) {
      const sp = R.specials[k], q = Math.max(0, (t - sp.t0) / sp.dur);

          ctx.fillStyle = 'rgba(80,40,140,0.5)'; ctx.fillRect(x - 22, y - 120, 44, 40); ctx.fillRect(x - 28, y - 130, 56, 10); ctx.fillRect(x - 26, y - 82, 8, 18); ctx.fillRect(x + 18, y - 82, 8, 18); break;
        case 'dance': ctx.globalAlpha = 1 - q; for (let a = 0; a < 8; a++) { const ang = a / 8 * Math.PI * 2 + q * 6; ctx.fillStyle = a % 2 ? '#ea80fc' : '#ffd54f'; ctx.fillRect(x + Math.cos(ang) * 50 - 3, y - 20 + Math.sin(ang) * 26 - 3, 6, 6); } break;
        case 'shout': ctx.strokeStyle = `rgba(255,204,128,${1 - q})`; ctx.lineWidth = 4; for (let w = 0; w < 3; w++) { ctx.beginPath(); ctx.arc(x, y - 20, 20 + (q * 90 + w * 20), 0, Math.PI * 2); ctx.stroke(); } break;
        case 'muscle': ctx.globalAlpha = 1 - q; ctx.fillStyle = '#ff7043'; for (let a = 0; a < 10; a++) { const ang = a / 10 * Math.PI * 2; ctx.fillRect(x + Math.cos(ang) * q * 70, y - 30 + Math.sin(ang) * q * 50, 8, 4); } break;
        case 'vomit': ctx.globalAlpha = (1 - q) * 0.75; ctx.fillStyle = '#8bc34a'; for (let a = 0; a < 9; a++) { const r2 = 20 + q * 50; ctx.beginPath(); ctx.arc(x + Math.cos(a) * r2 * 0.8, y - 10 + Math.sin(a * 1.7) * r2 * 0.4, 14 + a % 3 * 4, 0, Math.PI * 2); ctx.fill(); } break;
        case 'evolve': ctx.globalAlpha = Math.sin(q * Math.PI); const gr = ctx.createLinearGradient(x, y - 140, x, y + 20); gr.addColorStop(0, 'rgba(255,240,170,0)'); gr.addColorStop(1, 'rgba(255,230,120,0.8)'); ctx.fillStyle = gr; ctx.fillRect(x - 24, y - 140, 48, 160); break;

          const row = sp.extra.row, [x0, yy] = ART.hexCenter(0, row), x1 = ART.hexCenter(R.s.W - 1, row)[0], bx = x0 + (x1 - x0) * q;
          for (let m = 0; m < 6; m++) { const mx = bx - m * 26, by = yy + 14 + Math.sin(t / 90 + m) * 3; ctx.fillStyle = ['#e53935', '#fdd835', '#1e88e5'][m % 3]; ctx.fillRect(mx - 6, by - 26, 12, 16); ctx.fillStyle = '#f2cba8'; ctx.fillRect(mx - 4, by - 34, 8, 8); ctx.fillStyle = '#212121'; ctx.fillRect(mx - 5, by - 10, 4, 8); ctx.fillRect(mx + 1, by - 10, 4, 8); ctx.fillStyle = '#d4af37'; ctx.fillRect(mx + 6, by - 24, 8, 5); }
          if (Math.random() < 0.3) R.part(bx, yy - 30, ['#ffd54f', '#ea80fc'], 1, { speed: 0.6, up: 1, grav: -0.01, life: 700 });
          break; }
        case 'rain': ctx.strokeStyle = 'rgba(180,210,240,0.5)'; ctx.lineWidth = 1.5; for (let a = 0; a < 140; a++) { const rx = (ART.hash(a, 1, 3) * R.mw + t * 0.05) % R.mw, ry = (ART.hash(a, 2, 3) * R.mh + t * 0.6) % R.mh; ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(rx - 3, ry + 10); ctx.stroke(); } break;
        case 'ring': ctx.strokeStyle = sp.extra.col || '#ffd54f'; ctx.globalAlpha = 1 - q; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(x, y + 16, 10 + q * 60, 4 + q * 22, 0, 0, Math.PI * 2); ctx.stroke(); break;
      }
      ctx.restore();
    }
  }

  /* ---------- Minimapa ---------- */
  R.drawMini = function (cv) {
    if (!R.s || !R.mini) return;
    const c = cv.getContext('2d'), k = R.mini.k;
    c.clearRect(0, 0, cv.width, cv.height); c.drawImage(R.mini.cv, 0, 0);
    R.s.props.forEach(p => { const [x, y] = ART.hexCenter(p.c, p.r); c.fillStyle = p.owner >= 0 ? VV.FACTIONS[R.s.factions[p.owner].id].accent : '#fff'; c.fillRect(x * k - 3, y * k - 3, 6, 6); c.strokeStyle = '#1c1424'; c.strokeRect(x * k - 3, y * k - 3, 6, 6); });

  function init() {
    applySettings();
    document.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => {
      AU.init(); AU.sfx('select');
      const a = b.dataset.act;
      if (a === 'new') { renderSetup(); UI.show('setup'); }
      else if (a === 'continue') loadSave();
      else if (a === 'ency') { renderEncy(); UI.show('ency'); }
      else if (a === 'help') { const c = $('#help-body'); c.innerHTML = ''; c.appendChild(helpContent()); UI.show('help'); }
      else if (a === 'settings') settingsModal();
      else if (a === 'menu') UI.show('menu');
      else if (a === 'start') startFromSetup();
    }));
    $('#modal').addEventListener('pointerdown', e => { if (e.target.id === 'modal' && !$('#modal-card').querySelector('.hotseat,.endcard')) closeModal(null); });
    R.attach($('#map'));
    bindMap(); bindKeys();
    UI.show('menu');
    requestAnimationFrame(menuLoop); requestAnimationFrame(encyLoop);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})(window);

</script>
</body>
</html>
